[workspace]
resolver = "3"
members = ["crates/bme-core", "crates/bme-platform", "crates/bme-app"]
# The Tauri app is kept as unbuilt porting reference until the migration
# removes it; it is not part of the workspace.
exclude = ["src-tauri"]

# Dependencies shared by more than one member.
[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `[profile.release]` stays at Cargo's defaults so the release edit-test loop is
# fast. Every build is a release build; see "Build rules" in docs/development.md.

# Installers only: a release build with thin LTO, one codegen unit and stripped
# symbols. Never used for the edit-test loop.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
