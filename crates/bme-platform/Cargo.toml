[package]
name = "bme-platform"
version = "0.3.0"
description = "Per-OS integrations of BatchMkvExtract that GPUI does not provide: taskbar and dock progress, the display of a window."
authors = ["Sam Cao"]
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
log.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSDockTile", "NSProgressIndicator", "NSView", "NSImageView", "NSImage", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
